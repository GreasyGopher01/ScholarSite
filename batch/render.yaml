# render.yaml — Render Cron Job (free tier)
# ==========================================
# 1. Push repo to GitHub
# 2. Render dashboard → New → Cron Job → connect repo
# 3. Set MONGODB_URI and CRON_SECRET as secret env vars in dashboard

services:
  - type: cron
    name: scholarsite-scraper
    runtime: python
    plan: starter
    schedule: "0 6 * * 1"        # Every Monday 6 AM UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python scraper.py
    envVars:
      - key: DB_NAME
        value: scholarsite
      - key: COLLECTION_NAME
        value: opportunities
      - key: LOG_LEVEL
        value: INFO
      - key: MONGODB_URI
        sync: false               # Set this in the Render dashboard (secret)
